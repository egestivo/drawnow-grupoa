<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Administrador - DrawNow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
</head>
<body class="bg-gradient">

  <div class="admin-login-wrapper">
    <div class="admin-login-container">
      <div class="admin-login-card">
        <h1>DrawNow</h1>
        <p class="admin-title">Panel de Administrador</p>

        <form id="adminLoginForm">
          <div class="form-group">
            <label for="adminUser">Usuario:</label>
            <input
              type="text"
              id="adminUser"
              class="form-control form-control-lg"
              placeholder="admin"
              required
            >
          </div>

          <div class="form-group">
            <label for="adminPassword">Contraseña:</label>
            <input
              type="password"
              id="adminPassword"
              class="form-control form-control-lg"
              placeholder="*****"
              required
            >
          </div>

          <div id="adminLoginError" class="alert alert-danger d-none" role="alert"></div>

          <div class="admin-buttons">
            <button type="submit" class="btn btn-primary btn-lg admin-button">
              Ingresar
              <span class="loading-spinner"></span>
            </button>
          </div>
        </form>

        <button class="btn btn-outline-secondary w-100 mt-3" id="backToHomeBtn">
          Volver a Inicio
        </button>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/admin-auth.js"></script>
</body>
</html>
