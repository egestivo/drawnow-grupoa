<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Acceso - DrawNow</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="/css/styles.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-gradient">

  <div class="admin-login-wrapper">
    <div class="admin-login-container">
      <div class="admin-login-card">
        <h1>DrawNow</h1>
        <p class="admin-title" id="authTitle">Iniciar Sesión</p>

        <form id="authForm">
          <div class="form-group mb-3">
            <label for="authUser">Usuario / Email:</label>
            <input
              type="text"
              id="authUser"
              class="form-control form-control-lg"
              placeholder="Tu usuario"
              required
            >
          </div>

          <div class="form-group mb-3">
            <label for="authPassword">Contraseña:</label>
            <input
              type="password"
              id="authPassword"
              class="form-control form-control-lg"
              placeholder="*****"
              required
            >
          </div>

          <div id="authAlert" class="alert d-none" role="alert"></div>

          <div class="admin-buttons">
            <button type="submit" class="btn btn-primary btn-lg w-100" id="submitBtn">
              Ingresar
            </button>
          </div>
        </form>

        <div class="text-center my-3 text-muted">ó también puedes</div>
        
        <a href="/api/auth/google" class="btn btn-outline-danger btn-lg w-100 d-flex align-items-center justify-content-center gap-2">
          <i class="bi bi-google"></i> Continuar con Google
        </a>

        <div class="text-center mt-3">
          <a href="/reset-password" class="text-decoration-none" style="color: var(--primary); font-size: 0.9rem;">
            ¿Olvidaste tu contraseña?
          </a>
        </div>

        <div class="text-center mt-4">
          <a href="#" id="toggleAuthMode" class="text-decoration-none">¿No tienes cuenta? Regístrate aquí</a>
        </div>

      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
  <script src="/js/auth.js"></script>
</body>
</html>
